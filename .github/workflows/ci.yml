# Push lane. Everything here must stay fast enough that nobody is tempted to skip it.
#
# Lanes marked (stub) are wired but check nothing yet; they print a loud banner
# saying so. No lane may remain a stub past the phase named in the Makefile.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Fail rather than silently downloading a different toolchain than the pin.
  GOTOOLCHAIN: local

jobs:
  build-test:
    name: build + vet + unit + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Reads the go/toolchain directive from go.mod, so CI runs exactly the
          # pinned version and cannot drift from local development.
          go-version-file: go.mod
          check-latest: false
      - run: go version
      - run: make build
      - run: make vet
      - run: make fmt-check
      - run: make tidy-check
      # -short: every path runs, no path is swept. The silence claims over full
      # seed ranges are `make covering` and the soak, per CLAUDE.md's tiers.
      # Bounding the seed count was tried first and was not enough: the cost is
      # driven by the NUMBER of sweeping tests, not by any one bound.
      - run: make test
      # The A1 exit run is bounded here, not skipped: the race lane asks whether
      # anything reaches node state off the mailbox, which a few hundred seeds
      # answer. Full seed coverage is the test and soak lanes.
      - run: make race

  determinism:
    name: determinism vet pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # Every use of //rift:allow-nondeterminism is printed to stderr by this
      # step, and so lands in the build log. That visibility is the only thing
      # keeping exemptions from accumulating quietly (DESIGN-A0 D10).
      - run: make determinism
      # golang.org/x/tools is approved for this pass on the condition that it
      # never reaches a shipping binary (DESIGN-A0 Q4). This is the condition.
      - run: make tooling-only
      # The hatch registry is asserted diff-clean here. -update-hatches is
      # local-only and refuses to run with CI set: a lane that can rewrite the
      # list it checks against is not checking anything.
      - run: make hatches

  smoke:
    name: 500-seed simulator smoke (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - run: make smoke

  blind:
    name: blinded analyzer (the pass's own mutation lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # Blinds one determinism rule at a time and requires the named test to
      # fail. A pass that has quietly stopped checking something looks exactly
      # like a pass with nothing to report; this is the difference. Permanent,
      # alongside the mutant suite -- the two halves of CLAUDE.md Amendment A2.
      - run: make blind

  mutants:
    name: mutant suite + kill-time (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - run: make mutants
      # Once real (A0.12) this uploads kill-time per mutant so a regression in
      # harness sensitivity is visible even while every mutant is still killed.
      # See CLAUDE.md Amendment A2.

  power:
    name: harness power floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # Harness defects have silently reduced detection power while every other
      # lane stayed green. This one fails when a planted flaw class stops being
      # found at its standing floor.
      #
      # It covers the toy's four classes AND every mutant class. It did not cover
      # the mutants until A3, which is why it was green through the largest power
      # regression in the project: pre-vote took M18 from 10 detections in 500 to
      # 0 and M19 from 228 in 300 to 1, and nothing said so.
      - run: make power

  corpus:
    name: corpus replays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # "Every bug ever found replays from a single seed" is a published claim,
      # and nothing enforced it until this lane. A bundle stops reproducing the
      # moment the harness moves under it, in complete silence -- both A0
      # bundles had already rotted when the lane was written.
      - run: make corpus

  corpus-reproduces:
    name: corpus reproduction (every bundle still finds its bug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # `make corpus` asserts a bundle still produces the RUN it recorded. This
      # asserts it still produces the FINDING: apply its mutant, replay, and
      # require a violation, an inconclusive, a panic or a refusal. A bundle whose
      # schedule has stopped reaching its defect replays perfectly and proves
      # nothing, and regenerating one after a workload change re-records the
      # schedule without re-checking that it still bites.
      #
      # It was in the Makefile's `ci` target and NOT in this file. So was
      # `assertions`. DESIGN-A6 section 20.
      - run: make corpus-reproduces

  assertions:
    name: every declared assertion mechanism is invoked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # A check that is never invoked is indistinguishable from one that always
      # passes. This lane runs an ordinary run and requires every registered
      # every-run assertion to have fired at least once.
      - run: make assertions

  bundle-seeds:
    name: BUGS.md's seeds match the bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # "Reproduce (seed)" is the instruction a stranger follows and the bundle
      # is what they get, and nothing compared the two. Four entries had drifted
      # by A6, because a bundle is re-recorded whenever the workload moves under
      # it and the prose beside it is not.
      - run: make bundle-seeds

  lane-coverage:
    name: every lane in `make ci` runs in this file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The two jobs above were missing for a whole phase, and the Makefile's
      # `ci` target listed them the entire time. A lane that is not run is not a
      # lane, and a lane list that drifts from the thing that runs it is how a
      # lane stops being run without anybody deciding to stop running it.
      - run: make lane-coverage

  provenance:
    name: oracle input provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # The persist-before-reply oracle judged the system's acknowledgements
      # against the system's own account of what it held, and reported nothing
      # for a whole sweep. This lane requires that a system-reported fact fail to
      # COMPILE into a verdict, and induces it against a fixture that tries.
      - run: make provenance
